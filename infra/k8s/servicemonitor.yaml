apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fraud-api-monitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: fraud-detection-api
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: nodeport
      path: /metrics
      interval: 10s